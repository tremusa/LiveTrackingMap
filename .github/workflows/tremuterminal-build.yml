name: TremuTerminal Isolated Build

on:
  push:
    branches:
      - build/tremuterminal-v1
    paths:
      - '.tremuterminal/**'
      - '.github/workflows/tremuterminal-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct TremuTerminal source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tremuterminal
          cat .tremuterminal/chunk_*.b64 > /tmp/TremuTerminal.zip.b64
          base64 -d /tmp/TremuTerminal.zip.b64 > /tmp/TremuTerminal.zip
          unzip -q /tmp/TremuTerminal.zip -d _tremuterminal
          test -f _tremuterminal/settings.gradle.kts
          test -f _tremuterminal/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.11.1/bin/gradle --version

      - name: Unit tests
        working-directory: _tremuterminal
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: _tremuterminal
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TremuTerminal-debug-apk
          path: _tremuterminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
