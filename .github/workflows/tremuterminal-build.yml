name: TremuTerminal Isolated Build

on:
  push:
    branches:
      - build/tremuterminal-v1
    paths:
      - '.tremuterminal/**'
      - '.github/workflows/tremuterminal-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct TremuTerminal source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tremuterminal
          cat .tremuterminal/chunk_*.b64 > /tmp/TremuTerminal.zip.b64
          base64 -d /tmp/TremuTerminal.zip.b64 > /tmp/TremuTerminal.zip
          unzip -q /tmp/TremuTerminal.zip -d _tremuterminal
          test -f _tremuterminal/settings.gradle.kts
          test -f _tremuterminal/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        working-directory: _tremuterminal
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: _tremuterminal
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TremuTerminal-debug-apk
          path: _tremuterminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
